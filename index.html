<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>holaa</title>

<style>
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #0b1a2a;
  }

  canvas {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  /* ---------- BOTÓN ---------- */
  .btn-regalo {
    position: fixed;
    left: 50%;
    bottom: 32px;
    transform: translateX(-50%);
    z-index: 100;
    display: inline-block;
    background: linear-gradient(135deg, #ffd600, #ffab00);
    border: none;
    padding: 13px 34px;
    font-size: 1.05rem;
    font-weight: bold;
    color: #263238;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(255, 214, 0, 0.4);
    transition: transform 0.2s, box-shadow 0.2s, opacity 0.5s;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  .btn-regalo:hover {
    transform: translateX(-50%) scale(1.05);
    box-shadow: 0 8px 25px rgba(255, 214, 0, 0.6);
  }

  .btn-regalo:active {
    transform: translateX(-50%) scale(0.97);
  }

  /* ---------- TÍTULO ---------- */
  .titulo {
    position: fixed;
    left: 50%;
    top: 4%;
    transform: translateX(-50%);
    z-index: 50;
    opacity: 1;
    transition: opacity 0.8s ease, transform 0.8s ease;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    pointer-events: none;
    padding: 0 20px;
    color: #ffe066;
    font-size: clamp(1.2rem, 4vw, 1.8rem);
    font-weight: 800;
    letter-spacing: 0.05em;
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
  }

  .titulo.oculto {
    opacity: 0;
    transform: translateX(-50%) translateY(-30px);
  }

  /* ---------- TEXTO (arriba, oculto al inicio) ---------- */
  .texto {
    position: fixed;
    left: 50%;
    top: 3%;
    transform: translateX(-50%) translateY(-30px);
    z-index: 50;
    opacity: 0;
    transition: opacity 1s ease, transform 1s ease;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    pointer-events: none;
    padding: 0 20px;
    color: #fff;
    font-size: clamp(0.95rem, 3vw, 1.15rem);
    font-weight: 500;
    max-width: 520px;
    line-height: 1.55;
    text-shadow: 0 2px 14px rgba(0,0,0,0.95), 0 0 6px rgba(0,0,0,0.9), 0 1px 2px rgba(0,0,0,1);
  }

  .texto.mostrar-texto {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ---------- LLUVIA DE PÉTALOS ---------- */
  .floating-petal {
    position: fixed;
    top: -30px;
    background: radial-gradient(circle, #ffee58, #fbc02d);
    border-radius: 60% 40% 60% 40%;
    pointer-events: none;
    opacity: 0.85;
    z-index: 9999;
    animation: fall linear forwards;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.15));
  }

  @keyframes fall {
    0% {
      transform: translateY(0) rotate(0deg);
    }
    100% {
      transform: translateY(105vh) rotate(360deg);
    }
  }
</style>
</head>
<body>

<canvas></canvas>

<h2 class="titulo" id="titulo">Un tulipán, no de Shrek</h2>

<p class="texto" id="texto">
  "Yo vi esta flor y pensé en ti porque es bonita, y bueno, en realidad a mí no me gusta, pero creí que te gustaría porque tú sí eres bonita."
  <br>
  <span style="font-size: 0.85em; opacity: 0.8; font-style: italic;">Sí, es de Shrek💛</span>
</p>

<button id="actionBtn" class="btn-regalo" onclick="revealMessage()">Toca aquí 💛</button>

<script>
// ====================================================
// 1. ANIMACIÓN DEL RAMO (canvas)
// ====================================================
const TAU = Math.PI * 2;
const clamp = (v, min = 0, max = 1) => Math.min(max, Math.max(min, v));
const rand = (min, max) => min + Math.random() * (max - min);
const easeOutCubic = (x) => 1 - Math.pow(1 - x, 3);
const easeOutBack = (x) => {
  const c1 = 1.70158;
  const c3 = c1 + 1;
  return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
};

function qpoint(p0, p1, p2, s) {
  const u = 1 - s;
  return {
    x: u * u * p0.x + 2 * u * s * p1.x + s * s * p2.x,
    y: u * u * p0.y + 2 * u * s * p1.y + s * s * p2.y,
  };
}
function qderiv(p0, p1, p2, s) {
  return {
    x: 2 * (1 - s) * (p1.x - p0.x) + 2 * s * (p2.x - p1.x),
    y: 2 * (1 - s) * (p1.y - p0.y) + 2 * s * (p2.y - p1.y),
  };
}

function strokePartialCurve(ctx, p0, p1, p2, amount, steps = 24) {
  ctx.beginPath();
  ctx.moveTo(p0.x, p0.y);
  for (let k = 1; k <= steps; k++) {
    const p = qpoint(p0, p1, p2, (amount * k) / steps);
    ctx.lineTo(p.x, p.y);
  }
  ctx.stroke();
}

function drawLeaf(ctx, x, y, length, angle, color = '#37b24d') {
  if (length <= 0.5) return;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(length * 0.5, -length * 0.32, length, 0);
  ctx.quadraticCurveTo(length * 0.5, length * 0.32, 0, 0);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = 'rgba(15, 70, 25, 0.5)';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(length * 0.85, 0);
  ctx.stroke();
  ctx.restore();
}

function drawPetal(ctx, s, color) {
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.bezierCurveTo(s * 0.8, -s * 0.1, s * 0.75, -s * 1.3, s * 0.28, -s * 1.75);
  ctx.quadraticCurveTo(0, -s * 1.45, -s * 0.28, -s * 1.75);
  ctx.bezierCurveTo(-s * 0.75, -s * 1.3, -s * 0.8, -s * 0.1, 0, 0);
  ctx.fillStyle = color;
  ctx.fill();
}

function drawTulip(ctx, x, y, size, angle, colors, open) {
  const [light, mid] = colors;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  drawPetal(ctx, size * 1.05, mid);
  drawPetal(ctx, size * 0.85, light);
  ctx.restore();
}

function drawRibbon(ctx, x, y, size, t) {
  ctx.save();
  ctx.translate(x, y);

  for (const side of [-1, 1]) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(side * size * 0.08, size * 0.15);
    ctx.quadraticCurveTo(side * size * 0.45, size * 1.1, side * size * 0.70, size * 2.3);
    ctx.lineTo(side * size * 0.50, size * 2.3);
    ctx.lineTo(side * size * 0.55, size * 2.05);
    ctx.lineTo(side * size * 0.30, size * 2.05);
    ctx.quadraticCurveTo(side * size * 0.20, size * 1.0, side * size * 0.08, size * 0.15);
    ctx.closePath();
    const gradCola = ctx.createLinearGradient(0, size * 0.2, side * size * 0.6, size * 2.3);
    gradCola.addColorStop(0, '#ffffff');
    gradCola.addColorStop(1, '#c9c9c9');
    ctx.fillStyle = gradCola;
    ctx.fill();
    ctx.strokeStyle = 'rgba(120, 120, 120, 0.35)';
    ctx.lineWidth = 0.8;
    ctx.stroke();
    ctx.restore();
  }

  for (const side of [-1, 1]) {
    ctx.save();
    ctx.scale(side, 1);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(size * 0.9, -size * 1.1, size * 1.9, -size * 0.5, size * 1.5, size * 0.15);
    ctx.bezierCurveTo(size * 1.3, size * 0.55, size * 0.9, size * 0.35, 0, 0);
    const gradAla = ctx.createLinearGradient(0, -size * 0.6, size * 1.7, size * 0.4);
    gradAla.addColorStop(0, '#ffffff');
    gradAla.addColorStop(0.5, '#f1f1f1');
    gradAla.addColorStop(1, '#c9c9c9');
    ctx.fillStyle = gradAla;
    ctx.fill();
    ctx.strokeStyle = 'rgba(120, 120, 120, 0.35)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(size * 0.1, 0);
    ctx.bezierCurveTo(size * 0.7, -size * 0.4, size * 1.2, -size * 0.1, size * 1.0, size * 0.15);
    ctx.bezierCurveTo(size * 0.8, size * 0.25, size * 0.5, size * 0.15, size * 0.1, 0);
    ctx.fillStyle = 'rgba(180, 180, 180, 0.45)';
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(size * 0.7, -size * 0.35, size * 0.30, size * 0.14, -0.4, 0, TAU);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
    ctx.fill();
    ctx.restore();
  }

  for (const side of [-1, 1]) {
    ctx.save();
    ctx.scale(side, 1);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(size * 0.6, -size * 0.3, size * 1.0, size * 0.1, size * 0.7, size * 0.45);
    ctx.bezierCurveTo(size * 0.5, size * 0.5, size * 0.3, size * 0.25, 0, 0);
    ctx.fillStyle = '#e6e6e6';
    ctx.fill();
    ctx.strokeStyle = 'rgba(120, 120, 120, 0.4)';
    ctx.lineWidth = 0.8;
    ctx.stroke();
    ctx.restore();
  }

  ctx.save();
  ctx.beginPath();
  ctx.ellipse(0, size * 0.08, size * 0.28, size * 0.26, 0, 0, TAU);
  const gradNudo = ctx.createRadialGradient(-size * 0.08, size * 0.02, 0, 0, size * 0.08, size * 0.4);
  gradNudo.addColorStop(0, '#ffffff');
  gradNudo.addColorStop(0.6, '#ececec');
  gradNudo.addColorStop(1, '#b5b5b5');
  ctx.fillStyle = gradNudo;
  ctx.fill();
  ctx.strokeStyle = 'rgba(120, 120, 120, 0.45)';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(-size * 0.07, size * 0.02, size * 0.08, size * 0.05, -0.3, 0, TAU);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
  ctx.fill();
  ctx.restore();

  ctx.restore();
}

const COLORES_TULIPAN = [
  ['#fff8c4', '#ffe066', '#f59f00'],
  ['#ffe066', '#fdd835', '#e67700'],
  ['#fff3bf', '#ffd43b', '#fab005'],
  ['#ffe8a3', '#ffc300', '#d97706'],
];

const bg = {
  top: '#0a1220',
  mid: '#0d1f38',
  bot: '#08101c',
};

function create(ctx, w, h) {
  const cx = w / 2;
  const S = Math.min(w, h * 0.7);

  const paletaGrande = [
    { angle: 0,      dist: 0.00, len: 1.00, size: 0.095 },
    { angle: -0.20,  dist: 0.30, len: 0.98, size: 0.092 },
    { angle: 0.20,   dist: 0.30, len: 0.98, size: 0.092 },
    { angle: -0.45,  dist: 0.65, len: 0.85, size: 0.090, leaf: true, side: -1 },
    { angle: 0.45,   dist: 0.65, len: 0.85, size: 0.090, leaf: true, side:  1 },
    { angle: 0,      dist: 0.05, len: 0.88, size: 0.088 },
  ];

  const paletaPequena = [
    { angle: -0.10,  dist: 0.15, len: 0.78, size: 0.058 },
    { angle: 0.10,   dist: 0.15, len: 0.78, size: 0.058 },
    { angle: -0.30,  dist: 0.45, len: 0.72, size: 0.055 },
    { angle: 0.30,   dist: 0.45, len: 0.72, size: 0.055 },
    { angle: -0.55,  dist: 0.75, len: 0.62, size: 0.052 },
    { angle: 0.55,   dist: 0.75, len: 0.62, size: 0.052 },
  ];

  const paletaMini = [
    { angle: -0.20,  dist: 0.30, len: 0.55, size: 0.036 },
    { angle: 0.20,   dist: 0.30, len: 0.55, size: 0.036 },
    { angle: -0.42,  dist: 0.62, len: 0.50, size: 0.034 },
    { angle: 0.42,   dist: 0.62, len: 0.50, size: 0.034 },
  ];

  const grandes = paletaGrande.map((p, i) => {
    const hojas = p.leaf ? [{ u: 0.45, side: p.side, size: 1.0 }] : [];
    return {
      angle: p.angle + rand(-0.02, 0.02),
      dist: p.dist,
      length: S * 0.55 * p.len * rand(0.97, 1.03),
      size: S * p.size * rand(0.97, 1.03),
      colors: COLORES_TULIPAN[i % COLORES_TULIPAN.length],
      delay: 0.1 + Math.abs(p.dist) * 0.3 + rand(0, 0.15),
      phase: rand(0, TAU),
      leaves: hojas,
      priority: 1,
    };
  });

  const pequenas = paletaPequena.map((p, i) => ({
    angle: p.angle + rand(-0.02, 0.02),
    dist: p.dist,
    length: S * 0.55 * p.len * rand(0.95, 1.05),
    size: S * p.size * rand(0.95, 1.05),
    colors: COLORES_TULIPAN[(i + 2) % COLORES_TULIPAN.length],
    delay: 0.4 + Math.abs(p.dist) * 0.25 + rand(0, 0.15),
    phase: rand(0, TAU),
    leaves: [],
    priority: 2,
  }));

  const minis = paletaMini.map((p, i) => ({
    angle: p.angle + rand(-0.02, 0.02),
    dist: p.dist,
    length: S * 0.55 * p.len * rand(0.95, 1.05),
    size: S * p.size * rand(0.95, 1.05),
    colors: COLORES_TULIPAN[(i + 1) % COLORES_TULIPAN.length],
    delay: 0.55 + Math.abs(p.dist) * 0.2 + rand(0, 0.15),
    phase: rand(0, TAU),
    leaves: [],
    priority: 3,
  }));

  const flores = [...grandes, ...pequenas, ...minis];

  const motas = Array.from({ length: 55 }, () => ({
    x: rand(0, w), y: rand(0, h),
    r: rand(0.8, 2.6),
    speed: rand(6, 20),
    drift: rand(-8, 8),
    phase: rand(0, TAU),
  }));

  function geometry(f, t, gy) {
    const grow = easeOutCubic(clamp((t - f.delay) / 1.3));
    const sway = Math.sin(t * 0.8 + f.phase) * 0.04 * (0.3 + f.dist);
    const base = { x: cx + f.angle * 4, y: gy };
    const tipAngle = f.angle + sway;
    const tip = {
      x: base.x + Math.sin(tipAngle) * f.length * grow,
      y: base.y - Math.cos(tipAngle) * f.length * grow,
    };
    const ctrl = {
      x: base.x + Math.sin(f.angle * 0.5) * f.length * 0.15,
      y: base.y - f.length * 0.55 * grow,
    };
    return { grow, base, ctrl, tip };
  }

  // El ramo se queda quieto SIEMPRE en h * 0.82.
  const groundY = h * 0.82;

  return (t) => {
    const grad = ctx.createRadialGradient(cx, h * 0.45, 0, cx, h * 0.55, Math.max(w, h));
    grad.addColorStop(0, bg.mid);
    grad.addColorStop(0.5, bg.top);
    grad.addColorStop(1, bg.bot);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    const halo = ctx.createRadialGradient(cx, h * 0.4, 0, cx, h * 0.5, S * 0.85);
    halo.addColorStop(0, 'rgba(255, 210, 90, 0.18)');
    halo.addColorStop(0.4, 'rgba(255, 180, 60, 0.06)');
    halo.addColorStop(1, 'rgba(255, 160, 40, 0)');
    ctx.fillStyle = halo;
    ctx.fillRect(0, 0, w, h);

    ctx.fillStyle = '#ffd43b';
    for (const m of motas) {
      const y = (((m.y - t * m.speed) % h) + h) % h;
      const x = m.x + Math.sin(t * 0.6 + m.phase) * m.drift;
      ctx.globalAlpha = 0.15 + 0.5 * (0.5 + 0.5 * Math.sin(t * 1.5 + m.phase));
      ctx.beginPath();
      ctx.arc(x, y, m.r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    const orden = [...flores].sort((a, b) => {
      if (a.priority !== b.priority) return a.priority - b.priority;
      return Math.abs(b.dist) - Math.abs(a.dist);
    });

    for (const f of orden) {
      const { grow, base, ctrl, tip } = geometry(f, t, groundY);
      if (grow <= 0) continue;

      ctx.lineCap = 'round';
      const gradStem = ctx.createLinearGradient(base.x, base.y, tip.x, tip.y);
      gradStem.addColorStop(0, '#1e4d2b');
      gradStem.addColorStop(0.5, '#3a8a44');
      gradStem.addColorStop(1, '#4caf50');
      ctx.strokeStyle = gradStem;
      ctx.lineWidth = Math.max(2, f.size * 0.16);
      strokePartialCurve(ctx, base, ctrl, tip, grow);

      for (const lf of f.leaves) {
        const appear = easeOutBack(clamp((grow - lf.u) / 0.4));
        if (appear <= 0.01) continue;
        const p = qpoint(base, ctrl, tip, lf.u * grow);
        const d = qderiv(base, ctrl, tip, lf.u * grow);
        const baseAngle = Math.atan2(d.y, d.x);
        const hojaAngle = baseAngle + lf.side * 0.65;
        const hojaLen = f.size * 2.4 * appear * lf.size;
        const gradHoja = ctx.createLinearGradient(
          p.x, p.y,
          p.x + Math.cos(hojaAngle) * hojaLen,
          p.y + Math.sin(hojaAngle) * hojaLen
        );
        gradHoja.addColorStop(0, '#2e7d32');
        gradHoja.addColorStop(1, '#66bb6a');

        ctx.save();
        ctx.strokeStyle = '#3a8a44';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        const hx = p.x + Math.cos(hojaAngle) * hojaLen * 0.15;
        const hy = p.y + Math.sin(hojaAngle) * hojaLen * 0.15;
        ctx.lineTo(hx, hy);
        ctx.stroke();
        drawLeaf(ctx, hx, hy, hojaLen, hojaAngle, gradHoja);
        ctx.restore();
      }
    }

    for (const f of orden) {
      const bloom = easeOutBack(clamp((t - f.delay - 1.0) / 0.8));
      if (bloom <= 0.01) continue;
      const { grow, base, ctrl, tip } = geometry(f, t, groundY);
      if (grow <= 0) continue;

      const head = qpoint(base, ctrl, tip, grow);
      const d = qderiv(base, ctrl, tip, grow);
      const angle = Math.atan2(d.y, d.x) + Math.PI / 2;
      const open = easeOutCubic(clamp((t - f.delay - 1.6) / 1.5));
      drawTulip(ctx, head.x, head.y, f.size * bloom, angle, f.colors, open);
    }

    const ribbonAppear = easeOutBack(clamp((t - 0.2) / 1.0));
    if (ribbonAppear > 0.01) {
      const ribbonY = groundY - S * 0.15;
      drawRibbon(ctx, cx, ribbonY, S * 0.100 * ribbonAppear, t);
    }

    const shadow = ctx.createRadialGradient(
      cx, groundY + S * 0.18, 0,
      cx, groundY + S * 0.18, S * 0.5
    );
    shadow.addColorStop(0, 'rgba(0, 0, 0, 0.30)');
    shadow.addColorStop(0.6, 'rgba(0, 0, 0, 0.10)');
    shadow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = shadow;
    ctx.fillRect(0, 0, w, h);
  };
}

const lienzo = document.querySelector('canvas');
const pincel = lienzo.getContext('2d');

let dibujar;
let ancho = 0, alto = 0, escala = 1;
let tiempo = 0, anterior = performance.now();

function preparar() {
  ancho = innerWidth;
  alto = innerHeight;
  escala = Math.min(devicePixelRatio || 1, 2);
  lienzo.width = Math.round(ancho * escala);
  lienzo.height = Math.round(alto * escala);
  pincel.setTransform(escala, 0, 0, escala, 0, 0);
  dibujar = create(pincel, ancho, alto);
}

function cuadro(ahora) {
  const dt = Math.min((ahora - anterior) / 1000, 0.1);
  anterior = ahora;
  tiempo += dt;
  pincel.setTransform(escala, 0, 0, escala, 0, 0);
  pincel.globalAlpha = 1;
  pincel.globalCompositeOperation = 'source-over';
  dibujar(tiempo, dt);
  requestAnimationFrame(cuadro);
}

addEventListener('resize', () => {
  if (innerWidth !== ancho || innerHeight !== alto) preparar();
});

preparar();
requestAnimationFrame(cuadro);

let raining = false;

function revealMessage() {
  const btn = document.getElementById('actionBtn');
  btn.style.opacity = '0';
  setTimeout(() => { btn.style.display = 'none'; }, 500);

  // El título se va
  document.getElementById('titulo').classList.add('oculto');

  // El texto aparece arriba, en su lugar
  document.getElementById('texto').classList.add('mostrar-texto');

  // Lluvia de pétalos
  if (!raining) {
    raining = true;
    for (let i = 0; i < 15; i++) {
      setTimeout(createPetal, i * 60);
    }
    setInterval(createPetal, 180);
  }
}

function createPetal() {
  const petal = document.createElement('div');
  petal.className = 'floating-petal';

  const size = Math.random() * 12 + 10;
  petal.style.width = `${size}px`;
  petal.style.height = `${size * 1.5}px`;
  petal.style.left = Math.random() * window.innerWidth + 'px';

  const duration = Math.random() * 3 + 3;
  petal.style.animationDuration = duration + 's';

  document.body.appendChild(petal);

  setTimeout(() => {
    petal.remove();
  }, duration * 1000);
}
</script>

</body>
</html>
